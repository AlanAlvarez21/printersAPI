name: Build Node.js Executable

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-12]
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build executable
        run: |
          npm run build
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: printer-tunnel-${{ matrix.os }}
          path: dist/
          
  build-windows-only:
    # Only build Windows executable for releases
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows executable
        run: npm run build-win

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/printer-tunnel.exe
          body: |
            Windows executable with ngrok tunnel functionality
            Automatically creates ngrok tunnel and redirects to https://wmsys.fly.dev
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
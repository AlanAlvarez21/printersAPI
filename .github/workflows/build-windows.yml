name: Build Windows Executable
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  build-windows:
    runs-on: windows-2022 # Especificar versión para evitar migración
    steps:
      - uses: actions/checkout@v4 # Versión actualizada

      - name: Set up Python
        uses: actions/setup-python@v5 # Versión actualizada
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests dbfread certifi flask flask_cors pyserial pyusb
          pip install pyinstaller

      - name: Build executable with SSL fix
        run: |
          pyinstaller --onefile --console --name ProductionOrders_Uploader --hidden-import=certifi --collect-data certifi dbf_produciton_orders_uploader.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4 # Versión actualizada
        with:
          name: windows-executable
          path: dist/ProductionOrders_Uploader.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ProductionOrders_Uploader.exe
          body: |
            Windows executable generated automatically with SSL fix
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
